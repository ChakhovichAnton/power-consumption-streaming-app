version: '3.4'

services: 
  kafka:
    container_name: kafka
    image: 'bitnami/kafka:latest'
    ports:
      - "9094:9094"
    environment:
      - KAFKA_BROKER_ID=0
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_KRAFT_CLUSTER_ID=O94qfF0pQ4-lNvW65-IeRg
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Currently configured for testing on localhost
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/tmp/bitnami/kafka

  database:
    image: postgres:17
    container_name: postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  jobmanager:
    container_name: jobmanager
    image: pyflink:latest
    pull_policy: never
    expose:
      - "6123"
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    command: jobmanager
    volumes:
      - ./flink-stream-app:/flink-stream-app
      - flink_checkpoints:/flink-checkpoints
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
    env_file:
      - .env

  taskmanager:
    container_name: taskmanager
    image: pyflink:latest
    pull_policy: never
    expose:
      - "6121"
      - "6122"
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - flink_checkpoints:/flink-checkpoints
    links:
      - "jobmanager:jobmanager"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 3
    env_file:
      - .env

volumes:
  kafka_data:
    driver: local
  flink_checkpoints:
    driver: local
  postgres_data:
